name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      FEEDBACK_DATA_DIR: ${{ runner.temp }}/feedback-test-data
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            integrations/acgo/package-lock.json
      - name: Install Python dependencies
        run: python -m pip install -r requirements.lock.txt
      - name: Install JavaScript dependencies
        run: |
          npm --prefix frontend ci
          npm --prefix integrations/acgo ci --ignore-scripts
      - name: Backend tests (mock API, temporary databases)
        run: python -m pytest -q
      - name: ACGO core tests
        run: npm --prefix integrations/acgo test
      - name: Build frontend
        run: npm --prefix frontend run build
